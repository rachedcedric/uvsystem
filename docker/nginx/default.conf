# Ce conteneur n'est joignable que par le reverse proxy HTTPS (Caddy) sur le réseau privé Docker.
# Le proxy termine TLS : on transmet à PHP le schéma réel (HTTPS=on) pour que les URL, redirections
# et cookies « secure » soient générés en https.
map $http_x_forwarded_proto $app_https {
    default off;
    https   on;
}

server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;

    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Jamais de fichiers cachés, de sauvegardes ni de configuration.
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(env|sqlite|sql|log|bak|zip|lock|md)$ { deny all; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTPS $app_https;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 120s;
    }

    location ~* \.(?:css|js|woff2?|png|jpg|jpeg|gif|svg|ico|webp)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
