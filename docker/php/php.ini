; UVMASTER — réglages PHP de production
memory_limit = 512M          ; les PDF (DomPDF) sont gourmands : voir docs/MOBILE-DESIGN-SYSTEM.md et ExportController
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 120
max_input_time = 60
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
date.timezone = Africa/Abidjan
session.cookie_httponly = 1
session.use_strict_mode = 1
