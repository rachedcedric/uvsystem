<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>UVMASTER</title>
    <style>
        :root { --bg: #f5f7f2; --fg: #0e2a1c; --muted: #46594d; --brand: #0b6b3a; --brand-fg: #fff; }
        @media (prefers-color-scheme: dark) { :root { --bg: #08130d; --fg: #e6f0e8; --muted: #a9bcaf; --brand: #4cc04b; --brand-fg: #06150b; } }
        html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font-family: system-ui, 'Roboto', sans-serif; }
        main {
            min-height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: calc(32px + env(safe-area-inset-top)) 28px calc(32px + env(safe-area-inset-bottom)); text-align: center;
        }
        /* Le PNG clair a un fond blanc opaque : il se fond dans le papier. Le logo sombre est transparent. */
        .logo { display: block; width: min(70vw, 280px); height: auto; margin: 0 auto 36px; mix-blend-mode: multiply; }
        .logo-dark { display: none; }
        @media (prefers-color-scheme: dark) { .logo { mix-blend-mode: normal; } .logo-light { display: none; } .logo-dark { display: block; } }
        h1 { margin: 0 0 10px; font-size: 26px; line-height: 1.15; letter-spacing: -0.02em; }
        p { margin: 0; max-width: 420px; color: var(--muted); font-size: 16px; line-height: 1.45; }
        button {
            display: inline-flex; align-items: center; justify-content: center; gap: 10px; width: 100%; max-width: 420px; height: 54px;
            margin-top: 28px; border: 0; border-radius: 12px; background: var(--brand); color: var(--brand-fg); font-size: 16px; font-weight: 700;
        }
        button:active { transform: scale(.98); }
        button:disabled { opacity: .85; transform: none; }
        .spinner { display: none; width: 18px; height: 18px; box-sizing: border-box; border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
        button.is-loading .spinner { display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) { .spinner { animation: none; border-top-color: currentColor; opacity: .6; } }
    </style>
</head>

        <h1 id="title">Connexion impossible</h1>
        <p id="text">UVMASTER n'a pas pu joindre le serveur. Vérifiez votre connexion Internet puis réessayez. Si le problème persiste, le service est peut-être momentanément indisponible.</p>
        <button id="retry" type="button"><span class="spinner" aria-hidden="true"></span><span id="retry-label">Réessayer</span></button>
    </main>
    <script>
        (function () {
            'use strict';

            var KEY = 'uvmaster-auto-retry';
            var title = document.getElementById('title');
            var text = document.getElementById('text');
            var button = document.getElementById('retry');
            var label = document.getElementById('retry-label');
            var safety = null;

            function native() { return window.UvmasterNative || null; }

            function store() {
                try { return window.sessionStorage; } catch (e) { return null; }
            }

            // navigator.onLine ne dit que si l'appareil a un réseau, jamais si le serveur répond : il ne sert qu'à
            // choisir le message. Quand l'appareil se dit connecté, le texte reste volontairement neutre.
            function refreshMessage() {
                if (navigator.onLine === false) {
                    title.textContent = 'Pas de connexion Internet';
                    text.textContent = 'Activez le Wi-Fi ou les données mobiles, puis réessayez.';
                } else {
                    title.textContent = 'Connexion impossible';
                    text.textContent = "UVMASTER n'a pas pu joindre le serveur. Vérifiez votre connexion Internet puis réessayez. Si le problème persiste, le service est peut-être momentanément indisponible.";
                }
            }

            function setLoading(on) {
                button.disabled = on;
                button.classList.toggle('is-loading', on);
                label.textContent = on ? 'Connexion…' : 'Réessayer';
            }

            // Recharge l'URL du serveur CONFIGURÉE dans l'application (jamais une adresse écrite ici) : mêmes cookies,
            // même session. Si le rechargement échoue, Capacitor affiche de nouveau cette page, remise à zéro.
            function retry() {
                setLoading(true);
                clearTimeout(safety);
                safety = setTimeout(function () { setLoading(false); }, 20000);

                try {
                    if (native() && typeof native().retry === 'function') { native().retry(); return; }
                } catch (e) { /* repli ci-dessous */ }

                location.reload();
            }

            button.addEventListener('click', retry);

            // Une seule tentative automatique par panne : déclenchée au retour du réseau, jamais en boucle. Une nouvelle
            // panne (événement « offline ») réarme le mécanisme ; sans sessionStorage on ne tente rien automatiquement.
            window.addEventListener('offline', function () {
                var s = store();
                if (s) { try { s.removeItem(KEY); } catch (e) { /* ignoré */ } }
                refreshMessage();
            });
            window.addEventListener('online', function () {
                refreshMessage();
                var s = store();
                if (!s) { return; }
                try {
                    if (s.getItem(KEY)) { return; }
                    s.setItem(KEY, '1');
                } catch (e) { return; }
                retry();
            });

            refreshMessage();

            // La page d'erreur est prête à s'afficher : l'écran de chargement natif s'efface (il le fait aussi de
            // lui-même à la fin du chargement de cette page).
            try { if (native() && typeof native().appReady === 'function') { native().appReady(); } } catch (e) { /* ignoré */ }
        })();
    </script>
