<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>UVMASTER</title>
    <style>
        :root { --bg: #f5f7f2; --fg: #0e2a1c; --muted: #46594d; --brand: #0b6b3a; --brand-fg: #fff; }
        @media (prefers-color-scheme: dark) { :root { --bg: #08130d; --fg: #e6f0e8; --muted: #a9bcaf; --brand: #4cc04b; --brand-fg: #06150b; } }
        html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font-family: system-ui, 'Roboto', sans-serif; }
        main { min-height: 100%; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; padding: 32px 28px; box-sizing: border-box; }
        h1 { margin: 0 0 10px; font-size: 34px; line-height: 1.05; letter-spacing: -0.02em; }
        p { margin: 0; color: var(--muted); font-size: 16px; line-height: 1.45; }
        button { width: 100%; max-width: 420px; height: 54px; margin-top: 28px; border: 0; border-radius: 12px; background: var(--brand); color: var(--brand-fg); font-size: 16px; font-weight: 700; }
        button:active { transform: scale(.98); }
    </style>
</head>
<body>
    <main>
        <h1>Pas de connexion</h1>
        <p>L'application a besoin d'Internet pour afficher vos données.<br>Vérifiez votre connexion puis réessayez.</p>
        <button onclick="location.href='https://uvmaster.ci/m'">Réessayer</button>
    </main>
    <script>
        try { window.Capacitor.Plugins.SplashScreen.hide(); } catch (e) { /* masquage automatique */ }
    </script>
</body>
</html>
